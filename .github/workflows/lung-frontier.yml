name: Refresh lung frontier
on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-content-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search PubMed and publish reviewed summaries
        run: python scripts/sync_lung_frontier.py
      - name: Save literature data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/lung-frontier*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh monthly lung frontier'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
